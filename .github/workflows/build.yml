name: Build resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, resume]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ci/build.sh out

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          assets=()
          for f in out/*.pdf out/*.png; do
            base=$(basename "$f")
            assets+=("$f#${base//_/ }")
          done
          gh release create latest "${assets[@]}" \
            --title latest \
            --notes "" \
            --target "$GITHUB_SHA"
