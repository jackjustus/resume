name: Build resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, resume]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ci/build.sh out

      - name: Check layout
        run: ci/check.sh out

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          for f in out/*.pdf out/*.png; do
            base=$(basename "$f")
            assets+=("$f#${base//_/ }")
          done
          # GitHub's release API sometimes 5xxs mid-upload; start over and retry.
          for attempt in 1 2 3; do
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest "${assets[@]}" \
              --title latest \
              --notes "" \
              --target "$GITHUB_SHA" && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::release upload failed (attempt $attempt), retrying"
            sleep 10
          done
